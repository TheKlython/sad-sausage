name: Verify Sad Sausage Integrity & Security

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Manifest Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Core Manifest & MCP Unit Tests
        run: |
          python -m unittest test_validate_manifest.py test_sad_sausage_mcp.py -v

      - name: Run Gasmeter ESP Tests & Secret Hygiene
        run: |
          python -m pytest Gasmeter_ESP/tests/test_gasmeter.py -v

      - name: Run Optoma ESP Remote Tests & Secret Hygiene
        run: |
          python -m pytest "Optoma UHZ ESP remote/tests/test_optoma_parser.py" -v

  secret-scan:
    name: Secret & Credential Leak Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

